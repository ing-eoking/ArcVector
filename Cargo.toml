[package]
name = "arcusv"
version = "0.2.0"
edition = "2024"

[lib]
# cdylib: memcached loads this as an ASCII protocol extension.
# rlib:   lets `cargo test` exercise the pure modules (codec/quant/filter).
crate-type = ["cdylib", "rlib"]

[features]
# --- How the server was configured ------------------------------------------
#
# There are no feature flags for that any more. Which members
# `engine_interface_v1` has is decided by the server's own `config.h`, and that
# file is vendored in the layout the server itself uses -- `config.h` and
# `config_static.h` at the top, the headers they configure under
# `include/memcached` -- where `build.rs` hands it to clang exactly as the
# server's own build does. Copy a server tree's `config.h` and
# `include/memcached` in, retranslate, and the bindings match that server --
# including any ENABLE_* flag added to arcus after this was written.
#
#   cp <tree>/config.h <tree>/config_static.h .
#   cp <tree>/include/memcached/*.h include/memcached/
#   cargo build --features regen-bindings

# --- Bindings ----------------------------------------------------------------
#
# The translation of `include/` is committed, as `bindings/engine_api.rs`, so a
# plain `cargo build` copies it and never runs bindgen. That is what keeps
# libclang, and so LLVM, out of an ordinary build entirely.
#
# Turn this on to translate the headers again, after copying a server tree's
# `config.h`, `config_static.h` and `include/memcached` in. There is no way to
# point the build at headers outside the crate: a build that read them from
# elsewhere would either contradict the committed copy or quietly overwrite it,
# so following a different server means vendoring it here, where the crate's own
# files then say which server it is for. It needs libclang, and it writes its
# output back over the committed copy so the two cannot drift. `build.rs` also records a
# fingerprint of what it read, and refuses a later build whose headers no longer
# match it.
regen-bindings = ["dep:bindgen"]

# --- Test targets ------------------------------------------------------------
#
# The integration tests need an arcus server, which this crate does not build.
# Gating the target means `cargo test` does not report on tests it never ran.
integration = []

# Only built when the feature is on, so a plain `cargo test` says nothing about it
# rather than listing it as ignored.
[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["integration"]

[dependencies]
usearch = "2.26"
serde_json = "1"

[build-dependencies]
bindgen = { version = "0.72.1", optional = true }
cc = "1.4.4"
