[package]
name = "arcusv"
version = "0.2.0"
edition = "2024"

[lib]
# cdylib: memcached loads this as an ASCII protocol extension.
# rlib:   lets `cargo test` exercise the pure modules (codec/quant/filter).
crate-type = ["cdylib", "rlib"]

[features]
# --- How the memcached server was configured ---------------------------------
#
# These name the server's `configure` flags, not features of this crate. It calls
# no replication, migration or cluster API at all; each flag inserts members into
# `engine_interface_v1`, which is called by offset, so `get_item_info` and
# `get_elem_info` move even though nothing about them changes. The bindings must
# be generated with the same set the server has, and the server's own `config.h`
# lists which those are.
#
# `build.rs` reads CARGO_FEATURE_* and passes the matching `-D` to bindgen, so most
# of the effect is in the generated `engine_api.rs`. See docs/내부구조.md §2.2.
# Named after the flag with arcus's `ENABLE_` prefix dropped; `build.rs` puts it
# back, so the name is written once.
#
# `replication` implies `cluster-aware`, because the server cannot be configured
# the other way round: in `server_api.h` the `ENABLE_REPLICATION` member of
# `SERVER_CORE_API` — `set_switchover_node` — is nested *inside* the
# `ENABLE_CLUSTER_AWARE` block, so replication's own switchover hook does not
# exist without zk integration. Replication in arcus is a zk-managed
# master/slave pair; there is no non-clustered form of it to build against.
#
# It is also free: `ENABLE_CLUSTER_AWARE` appears nowhere in `engine.h`, so it
# moves no member of `engine_interface_v1`, and the three members it inserts into
# `SERVER_CORE_API` all sit after the four this crate calls (`get_current_time`,
# `server_version`, `store_engine_specific`, `get_engine_specific`). Nothing this
# crate reaches for shifts either way — what the implication buys is two fewer
# binding variants to keep honest.
replication = ["cluster-aware"]
migration = []
cluster-aware = []

# ENABLE_PERSISTENCE. Unlike the three above it changes no header this crate
# reads — it lives in `engines/default/*.h`, not `include/memcached/` — so it
# passes no define and moves no vtable member. It states one fact: the server
# restores items on restart, so a Map can outlive this process's graph.
persistence = []

# Recovery — rebuilding a graph from Map — is what those two facts imply, and
# `build.rs` turns `cfg(recovery)` on when either is set. Neither replication nor
# persistence means nothing can outlive the graph, so the ownership token, the
# metadata read on every command and the rebuild thread are all dead weight; an
# index whose graph is missing then answers NOT_FOUND and is recreated by hand.

# --- Bindings ----------------------------------------------------------------
#
# `include/memcached/*.h` is fixed and so is what bindgen makes of it, so the
# translation is committed under `bindings/` -- one file per combination of the
# three flags above, since each moves members in `engine_interface_v1`. A plain
# `cargo build` copies the matching one and never runs bindgen, which is what
# keeps libclang, and so LLVM, out of the build entirely.
#
# Turn this on to translate the headers again: after editing anything under
# `include/`, or to build against a tree named by ARCVECTOR_ENGINE_INCLUDE, which
# the committed bindings by definition do not describe. It needs libclang, and it
# writes its output back over `bindings/` so the two cannot drift. `make bindings`
# runs it over every combination.
regen-bindings = ["dep:bindgen"]

# --- Test targets ------------------------------------------------------------
#
# The integration tests need an arcus server, which this crate does not build.
# Gating the target means `cargo test` does not report on tests it never ran.
integration = []

# The replication tests need an EE server built with ENABLE_REPLICATION, a running
# ZooKeeper, and a provisioned master/slave pair. None of that is available in the
# container `make test` uses, so these stay out of the required suite entirely —
# a green run must not imply switchover was covered. See docs/replication-testing.md.
#
# Implies `replication`, since the server it talks to has it.
replication-tests = ["replication"]

# Only built when the feature is on, so a plain `cargo test` says nothing about it
# rather than listing it as ignored.
[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["integration"]

[[test]]
name = "replication"
path = "tests/replication.rs"
required-features = ["replication-tests"]

[dependencies]
usearch = "2.26"
serde_json = "1"

[build-dependencies]
bindgen = { version = "0.72.1", optional = true }
cc = "1.4.2"
