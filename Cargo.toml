[package]
name = "arcusv"
version = "0.2.0"
edition = "2024"

[lib]
# cdylib: memcached loads this as an ASCII protocol extension.
# rlib:   lets `cargo test` exercise the pure modules (codec/quant/filter).
crate-type = ["cdylib", "rlib"]

[features]
# --- How the daemon was configured -------------------------------------------
#
# These describe the *daemon*, not this crate — hence the `daemon-` prefix. This
# crate calls no replication, migration or cluster API at all; each flag merely
# inserts members into `engine_interface_v1`, which is called by offset, so
# `get_item_info` and `get_elem_info` move even though nothing about them changes.
# The bindings must therefore be generated with the same set the daemon has.
#
# `build.rs` reads CARGO_FEATURE_* and passes the matching `-D` to bindgen, so most
# of the effect is in the generated `engine_api.rs`.
#
# The daemon's own `config.h` lists which to pass. See docs/engine-abi.md.
daemon-replication = []    # -DENABLE_REPLICATION
daemon-migration = []      # -DENABLE_MIGRATION
daemon-cluster-aware = []  # -DENABLE_CLUSTER_AWARE

# ENABLE_PERSISTENCE. Unlike the three above it changes no header this crate
# reads — it lives in `engines/default/*.h`, not `include/memcached/` — so it
# passes no define and moves no vtable member. It states one fact: the daemon
# restores items on restart, so a Map can outlive this process's graph.
daemon-persistence = []

# Recovery — rebuilding a graph from Map — is what those two facts imply, and
# `build.rs` turns `cfg(recovery)` on when either is set. Neither replication nor
# persistence means nothing can outlive the graph, so the ownership token, the
# metadata read on every command and the rebuild thread are all dead weight; an
# index whose graph is missing then answers NOT_FOUND and is recreated by hand.

# --- Test targets ------------------------------------------------------------
#
# The integration tests need an arcus daemon, which this crate does not build.
# Gating the target means `cargo test` does not report on tests it never ran.
integration = []

# The replication tests need an EE daemon built with ENABLE_REPLICATION, a running
# ZooKeeper, and a provisioned master/slave pair. None of that is available in the
# container `make test` uses, so these stay out of the required suite entirely —
# a green run must not imply switchover was covered. See docs/replication-testing.md.
#
# Implies `daemon-replication`, since the daemon it talks to has it.
replication-tests = ["daemon-replication"]

# Only built when the feature is on, so a plain `cargo test` says nothing about it
# rather than listing it as ignored.
[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["integration"]

[[test]]
name = "replication"
path = "tests/replication.rs"
required-features = ["replication-tests"]

[dependencies]
usearch = "2.26"
serde_json = "1"

[build-dependencies]
bindgen = "0.72.1"
cc = "1.4.2"
