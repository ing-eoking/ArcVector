<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArcVector Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 16px 24px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .bubble {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bubble.user {
      align-self: flex-end;
      background: #4f46e5;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .bubble.bot {
      align-self: flex-start;
      background: #fff;
      color: #111;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .bubble.bot .sources {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #e5e5e5;
      font-size: 12px;
      color: #888;
    }

    .bubble.bot .sources span {
      display: block;
      margin-top: 4px;
    }

    .thinking {
      align-self: flex-start;
      background: #fff;
      color: #aaa;
      padding: 12px 16px;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      font-style: italic;
    }

    #input-area {
      display: flex;
      gap: 8px;
      padding: 16px 24px;
      background: #fff;
      border-top: 1px solid #e5e5e5;
    }

    #input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 24px;
      font-size: 15px;
      outline: none;
      resize: none;
    }

    #input:focus { border-color: #4f46e5; }

    #send {
      padding: 12px 24px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 24px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #send:hover { background: #4338ca; }
    #send:disabled { background: #a5b4fc; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>Arcus Chat</header>
  <div id="chat"></div>
  <div id="input-area">
    <input id="input" type="text" placeholder="질문을 입력하세요..." autocomplete="off" />
    <button id="send">전송</button>
  </div>

  <script>
    const SERVER = 'http://localhost:8000';
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const send = document.getElementById('send');

    function addBubble(role, text, sources) {
      const div = document.createElement('div');
      div.className = `bubble ${role}`;
      div.textContent = text;

      if (sources && sources.length > 0) {
        const src = document.createElement('div');
        src.className = 'sources';
        src.textContent = '참고 문서:';
        sources.forEach((s, i) => {
          const span = document.createElement('span');
          span.textContent = `[${i+1}] (score: ${s.score.toFixed(3)}) ${s.text.slice(0, 80)}…`;
          src.appendChild(span);
        });
        div.appendChild(src);
      }

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function submit() {
      const message = input.value.trim();
      if (!message) return;

      input.value = '';
      send.disabled = true;
      addBubble('user', message);

      const thinking = document.createElement('div');
      thinking.className = 'thinking';
      thinking.textContent = '답변 생성 중…';
      chat.appendChild(thinking);
      chat.scrollTop = chat.scrollHeight;

      try {
        const resp = await fetch(`${SERVER}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
        });
        const data = await resp.json();
        thinking.remove();
        if (data.error) {
          addBubble('bot', '서버 오류: ' + data.error);
        } else {
          addBubble('bot', data.answer, data.sources);
        }
      } catch (e) {
        thinking.remove();
        addBubble('bot', '서버에 연결할 수 없습니다. server.py가 실행 중인지 확인해주세요.');
      } finally {
        send.disabled = false;
        input.focus();
      }
    }

    send.addEventListener('click', submit);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
    });
  </script>
</body>
</html>
